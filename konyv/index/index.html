<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Könyvtáram – Digitális Könyvespolc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script src="index.js" defer></script>
  </head>
  <body>
    <!-- Felső navigációs sáv -->
    <nav class="top-navbar">
      <div
        class="container py-1 d-flex justify-content-between align-items-center"
      >
        <div class="d-flex align-items-center gap-2">
          <span class="brand-icon">📚</span>
          <span class="brand-logo">Könyvtáram</span>
        </div>

        <!-- Kijelentkezett gomb -->
        <div id="guestNav">
          <button
            class="btn btn-accent btn-sm px-3"
            type="button"
            data-bs-toggle="modal"
            data-bs-target="#authModal"
          >
            Belépés / Regisztráció
          </button>
        </div>

        <!-- Bejelentkezett vezérlők -->
        <div
          id="userNav"
          class="d-flex align-items-center gap-2 gap-sm-3"
          hidden
        >
          <span id="welcome" class="welcome-badge d-none d-sm-inline"></span>
          <button
            class="btn btn-accent btn-sm px-3"
            type="button"
            data-bs-toggle="modal"
            data-bs-target="#addBookModal"
          >
            + Új könyv
          </button>
          <button id="logoutButton" class="btn btn-sm btn-logout" type="button">
            Kilépés
          </button>
        </div>
      </div>
    </nav>

    <!-- Fő tartalom (Teljes szélességű könyvespolc) -->
    <main class="container py-4">
      <div id="message"></div>

      <!-- Központi vezérlősáv (Fülek + Számláló) -->
      <div
        class="toolbar-panel mb-4 d-flex flex-column flex-sm-row justify-content-between align-items-stretch align-items-sm-center gap-3"
      >
        <div class="view-tabs">
          <button type="button" class="view-btn active" id="btnShowPublic">
            🌍 Publikus könyvek
          </button>
          <button type="button" class="view-btn" id="btnShowUser" hidden>
            🔖 Elmentett könyveim
          </button>
        </div>
        <span id="bookCountBadge" class="badge-pill text-center"></span>
      </div>

      <!-- Saját könyvek rács -->
      <div id="userSection" hidden>
        <div id="userBooks" class="row g-3 g-md-4"></div>
      </div>

      <!-- Publikus könyvek rács -->
      <div id="publicSection">
        <div id="publicBooks" class="row g-3 g-md-4"></div>
      </div>
    </main>

    <!-- MODAL 1: Bejelentkezés és Regisztráció -->
    <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content custom-modal">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title fw-bold" id="authModalTitle">
              Bejelentkezés
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Bezárás"
            ></button>
          </div>
          <div class="modal-body pt-3">
            <div class="auth-tabs mb-3">
              <button
                type="button"
                class="auth-tab active"
                id="tabLogin"
                onclick="switchAuthTab('login')"
              >
                Bejelentkezés
              </button>
              <button
                type="button"
                class="auth-tab"
                id="tabRegister"
                onclick="switchAuthTab('register')"
              >
                Regisztráció
              </button>
            </div>

            <div id="modalMessage" class="small fw-bold text-center mb-2"></div>

            <form id="loginForm">
              <p class="text-muted small mb-3">
                Lépj be a saját könyvespolcod kezeléséhez.
              </p>
              <input
                class="form-control mb-2"
                type="email"
                id="loginEmail"
                placeholder="E-mail cím"
                required
              />
              <input
                class="form-control mb-3"
                type="password"
                id="loginPassword"
                placeholder="Jelszó"
                required
              />
              <button class="btn btn-dark-slate w-100" type="submit">
                Bejelentkezés
              </button>
            </form>

            <form id="registerForm" hidden>
              <p class="text-muted small mb-3">
                Hozz létre egy új fiókot pillanatok alatt.
              </p>
              <input
                class="form-control mb-2"
                type="text"
                id="regUsername"
                placeholder="Felhasználónév"
                required
              />
              <input
                class="form-control mb-2"
                type="email"
                id="regEmail"
                placeholder="E-mail cím"
                required
              />
              <input
                class="form-control mb-3"
                type="password"
                id="regPassword"
                placeholder="Jelszó"
                required
              />
              <button class="btn btn-accent w-100" type="submit">
                Regisztráció
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL 2: Új könyv hozzáadása -->
    <div class="modal fade" id="addBookModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content custom-modal">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title fw-bold">Új könyv hozzáadása</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Bezárás"
            ></button>
          </div>
          <div class="modal-body pt-3">
            <form id="bookForm">
              <input
                class="form-control mb-2"
                id="bookTitle"
                placeholder="Könyv címe"
                required
              />
              <input
                class="form-control mb-2"
                id="isbn"
                placeholder="ISBN (egyedi azonosító)"
                required
              />
              <input
                class="form-control mb-2"
                id="author"
                placeholder="Szerző"
                required
              />
              <div class="row g-2 mb-2">
                <div class="col-6">
                  <input
                    class="form-control"
                    id="publishedYear"
                    type="number"
                    placeholder="Kiadás éve"
                    required
                  />
                </div>
                <div class="col-6">
                  <input
                    class="form-control"
                    id="pages"
                    type="number"
                    placeholder="Oldalszám"
                    required
                  />
                </div>
              </div>
              <input
                class="form-control mb-2"
                id="genre"
                placeholder="Műfaj"
                required
              />
              <input
                class="form-control mb-2"
                id="cover"
                type="url"
                placeholder="Borítókép URL (opcionális)"
              />
              <select id="isPublic" class="form-select mb-3">
                <option value="1">Publikus (mindenki látja)</option>
                <option value="0">Privát (csak én látom)</option>
              </select>
              <button class="btn btn-accent w-100" type="submit">
                Könyv mentése
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
